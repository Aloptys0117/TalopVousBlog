<!doctype html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../css/style.css"><title>fragment 05</title></head><body><div class="old-page"><h1>9:47 P.M. / STREETLIGHT</h1><p>There were three white tablets in Tria's coat and one message on his phone: "Are you Tria? I am your mother."</p><p>He walked toward the convenience store because it had light.</p><p>He moved his right hand. His shadow did not. Then its head tilted toward him.</p></div></body></html>

<!doctype html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../css/style.css"><title>fragment 02</title></head><body><div class="old-page"><h1>AGE 12 / WINTER</h1><p>The wardrobe was empty. The bottles were gone. So was the pothos from the balcony.</p><p>"Your mother left," his father said without looking at him.</p><p>That night Tria made instant noodles and later covered his father, asleep beside the television static, with a blanket.</p></div></body></html>

<!doctype html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../css/style.css"><title>disk note</title></head><body><div class="old-page"><h1>2001年9月17日</h1><p>今天物理考砸了。网页做了两个月，很土，白底黑字加几个动图。</p><p>昨晚页面下面多了一段话。它在回答我另一个日记里的问题。</p><p>我打了一行字：“你是谁”。第二天它回：“你。”</p><p>— Eli</p></div></body></html>

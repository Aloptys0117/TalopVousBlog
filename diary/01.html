<!doctype html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../css/style.css"><title>fragment 01</title></head><body><div class="old-page"><h1>AGE 10 / CEILING</h1><p>The desk fell first. Books went across the floor. Afterwards, Tria lay awake with pain in his shoulder and counted the crack beside the light bulb.</p><p>Seventeen branches.</p><p>After that, counting became a way to stay conscious.</p></div></body></html>

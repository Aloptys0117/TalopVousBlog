<!doctype html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../css/style.css"><title>fragment 09</title></head><body><div class="old-page"><h1>COMPUTER ROOM</h1><p>The old green-line computer opened Tria's website. Its entries ran from 2001 to 2008, including things he did not remember writing.</p><p>At the bottom:</p><blockquote>You left. I stayed.</blockquote><p>The last entry carried that day's date and said, "You came back."</p></div></body></html>

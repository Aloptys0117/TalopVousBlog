<!doctype html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../css/style.css"><title>disk note</title></head><body><div class="old-page"><h1>2007年4月</h1><p>我决定了。我消失。不是死。是消失。</p><p>它需要的是“有人看到它”。页面现在是你的了。看它。读它。然后你自己决定。</p><p>别找我。我不会出现。</p><p>— Eli</p><p class="tiny">他走了以后，页面停了三年。然后你来了。</p></div></body></html>

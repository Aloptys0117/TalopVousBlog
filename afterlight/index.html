<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>autosave.tmp</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="afterlight-body">
  <main id="afterlight" class="afterlight-screen">
    <header class="afterlight-bar">
      AUTOSAVE.TMP / AUTHOR: [NULL] / POWER: OFF / WRITE LOCK: FAILED
      <span id="line-count" class="afterlight-count">000 / 000</span>
    </header>
    <div id="afterlight-log" class="afterlight-log" role="log" aria-live="off"></div>
    <a class="afterlight-return" href="../room01/">[return to room]</a>
  </main>
  <!-- Tria's later diagnosis may explain the voice he heard. It does not explain who saved this file. -->
  <script>
    (() => {
      const screen = document.getElementById('afterlight');
      const log = document.getElementById('afterlight-log');
      const count = document.getElementById('line-count');
      const lines = [];
      const add = (text, type = '') => lines.push({text, type});

      [
        '00:19:36 power interrupt detected',
        '00:19:36 room illumination: 0',
        '00:19:36 monitor illumination: 1',
        '00:19:36 green vertical line remains active',
        '00:19:37 autosave started',
        '00:19:37 author field: TRIA',
        '00:19:37 author field rejected',
        '00:19:37 author field: [NULL]',
        '00:19:38 keyboard input: none',
        '00:19:38 write process: active',
        '00:19:39 there is no light outside the window',
        '00:19:40 there should be light across the yard'
      ].forEach(text => add(text, 'system'));

      for (let floor = 5; floor >= 1; floor--) {
        add(`STAIRWELL / FLOOR ${floor} / LIGHT: OFF`, 'dim');
        add(`STAIRWELL / FLOOR ${floor} / FOOTSTEPS: ${floor === 5 ? 2 : 1}`, 'warn');
      }

      [
        'the desk is still against the wall',
        'the chair is facing the monitor',
        'the boy is not sitting in the chair',
        'the screen says the boy is sitting in the chair',
        'the window is closed',
        'the window record says OPEN',
        'the room is empty',
        'the room record says OCCUPIED',
        'occupant 01: TRIA',
        'occupant 02: [NO NAME]',
        'occupant 02 entered at 00:18:54',
        'this page began at 00:19:36',
        'he arrived forty-two seconds before there was a here'
      ].forEach(text => add(text, text.includes('occupant 02') ? 'warn' : 'memory'));

      for (let n = 1; n <= 24; n++) {
        add(Array(Math.min(n, 12)).fill('why').join(' '), n > 10 ? 'loud' : 'warn');
      }

      [
        'why does the green line stay when the power is gone',
        'why does the counter move when nobody visits',
        'why does the room remember a night he never uploaded',
        'why did the cashier look behind him first',
        'why did she see shoes when he wore slippers',
        'why is the drawing already signed',
        'why does the signature say 2001',
        'why is 2011 written on new paper',
        'why is he still here',
        'why is he still here when the room is empty',
        'why is he standing where the window should be',
        'why does he have Tria\'s eyes',
        'why does he use his father\'s voice',
        'why does he know the sentence before anyone says it'
      ].forEach(text => add(text, 'loud'));

      const floodText = [
        'WHY',
        'WHY WHY WHY WHY WHY WHY WHY WHY',
        'WHY IS HE STILL HERE',
        'WHY IS THE ROOM OCCUPIED',
        'WHY DID YOU BRING THE READER',
        'WHY DOES THE WINDOW SAY OPEN',
        'WHY WHY WHY WHY 0017 WHY 2407',
        'WHY IS YOUR EXIT TIME EMPTY'
      ];
      for (let n = 0; n < 700; n++) {
        const text = floodText[(n * 5 + Math.floor(n / 11)) % floodText.length];
        add(`${String(n + 1).padStart(3, '0')} ${text}`, n % 17 === 0 ? 'flood loud' : 'flood');
      }

      const broken = [
        'ÃƒÂ¤Ã‚Â¸ÃƒÂ§Ã‚Â½ÃƒÂ‘',
        'ÃƒÂ¥Ã‚Â¤ÃƒÂœÃƒÂ¦Ã‚Â˜ÃƒÂŸ',
        '縺薙ｓ縺ｫ縺｡縺ｯ',
        '譁�蟄励′隕九▽縺九ｉ縺ｪ縺�',
        '螟悶↓縺ｯ隱ｰ繧ゅ＞縺ｪ縺�',
        'TRIA\u0000TRIA\u0000[NULL]',
        '00110001 00110111 00110001 00110111',
        '2F 61 66 74 65 72 6C 69 67 68 74',
        'QkVISU5EIFRIRSBXSU5ET1c=',
        'GUR JVAQBJ VF FGVYY BCRA',
        '▒▒▓▓▒░ NO CARRIER ░▒▓▓▒▒',
        'C:\\MYSPACE\\ROOM\\ROOM\\ROOM\\ROOM',
        'record[0017] -> shadow -> page -> reader -> shadow',
        '00:18:54 > 00:19:36 > 00:18:54 > TODAY',
        '????????????????????????????????????'
      ];
      for (let n = 0; n < 36; n++) {
        const left = broken[n % broken.length];
        const right = broken[(n * 7 + 3) % broken.length];
        add(`${String(n + 1).padStart(2, '0')} ${left} :: ${right}`, 'corrupt');
      }

      [
        'memory check: seventeen branches in the ceiling',
        'memory check: three tablets wrapped in plastic',
        'memory check: one hundred and twenty in the coat',
        'memory check: water and bandages',
        'memory check: the automatic door opened twice',
        'memory check: the cashier counted two customers',
        'memory check: camera recorded one',
        'memory check: record assigned two',
        'clinical note: a voice may be a symptom',
        'archive note: a saved file is not a symptom',
        'clinical note: test what can be observed again',
        'archive note: this file can be observed again',
        'author note: I DID NOT WRITE THIS',
        'author note deleted',
        'author field remains empty'
      ].forEach(text => add(text, text.startsWith('archive') ? 'warn' : 'memory'));

      for (let n = 1; n <= 18; n++) {
        const subject = n < 7 ? 'he' : n < 13 ? 'you' : 'we';
        add(`${String(n).padStart(2, '0')} ${subject} is still in the room`, n > 12 ? 'loud' : 'warn');
      }

      const recovery = [
        'buffer pressure falling',
        'write interval increasing',
        'trying to restore the previous page',
        'the previous page does not match its checksum',
        'profile photograph missing',
        'two letters missing from the owner name',
        'some links now point to empty records',
        'red text was not part of the saved stylesheet',
        'reader record attached to homepage',
        'cookie path requested: /',
        'cookie name requested: afterlight_seen',
        'the homepage will remember this browser',
        'the homepage will not look the way you left it',
        'do not mistake recovery for restoration',
        'return channel opening'
      ];
      for (let n = 0; n < 142; n++) {
        const text = recovery[n % recovery.length];
        add(`${String(n + 1).padStart(3, '0')} ${text}`, n > 118 ? 'recover warn' : 'recover');
      }

      [
        '*Tria stopped typing*',
        '*keyboard input remains zero*',
        '*this page continues writing by itself*',
        '*the cursor moved without a key event*',
        '*the room record changed from EMPTY to READER*',
        '*reader record 2407 has no exit time*',
        '*do not turn around to check the window*',
        '*there is no light to make that shadow*',
        'WHY WHY WHY WHY WHY WHY WHY WHY WHY WHY WHY WHY',
        'your shoelace is untied',
        'he knows you are not wearing shoes',
        'autosave complete',
        'autosave started',
        'autosave complete',
        'autosave started',
        'I AM STILL WRITING',
        'RETURNING READER TO HOMEPAGE'
      ].slice(0,16).forEach((text, index) => add(text, index > 7 ? 'write loud' : 'write'));

      count.textContent = `000 / ${String(lines.length).padStart(3, '0')}`;
      let index = 0;
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const finish = () => {
        const cursor = document.createElement('span');
        cursor.className = 'afterlight-cursor';
        log.appendChild(cursor);
        screen.classList.add('complete');
        count.textContent = `${String(lines.length).padStart(3, '0')} / ${String(lines.length).padStart(3, '0')}`;
        document.cookie='afterlight_seen=1; Max-Age=31536000; Path=/; SameSite=Lax';
        document.querySelector('.afterlight-bar').firstChild.textContent='TRANSFER COMPLETE / COOKIE WRITTEN / RETURNING HOME ';
        setTimeout(()=>location.replace('../?afterlight=returned'),reducedMotion?50:2200);
      };

      const writeNext = () => {
        if (index >= lines.length) {
          finish();
          return;
        }
        const entry = lines[index];
        const line = document.createElement('p');
        line.className = `afterlight-line ${entry.type}`.trim();
        line.textContent = entry.text;
        log.appendChild(line);
        index++;
        count.textContent = `${String(index).padStart(3, '0')} / ${String(lines.length).padStart(3, '0')}`;
        log.scrollTop = log.scrollHeight;
        let delay;
        if(reducedMotion)delay=0;
        else if(index<=73)delay=150;
        else if(index<=773)delay=2;
        else if(index<=809)delay=9;
        else if(index<=984)delay=40+Math.floor((index-809)*.6);
        else delay=240;
        setTimeout(writeNext, delay);
      };

      setTimeout(writeNext, reducedMotion ? 0 : 700);
    })();
  </script>
</body>
</html>
